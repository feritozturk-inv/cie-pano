      /* ── Layout ── */
      .shell {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .topbar {
        background: var(--bg2);
        border-bottom: 1px solid var(--border);
        padding: 0 16px;

        align-items: center;

      .topbar-brand {

      }
      .topbar-brand span {

      .tab-btn {

      }
      .topbar-actions {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-left: auto;
      }
      .btn-icon {
        background: none;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text2);
        padding: 5px 10px;
        font-size: 0.75rem;
        transition:
          border-color 0.15s,
          color 0.15s;
      }
      .btn-icon:hover {
        border-color: var(--accent);
        color: var(--text);
      }
      .main {
        flex: 1;
        padding: 20px 16px;
        max-width: 1280px;
        margin: 0 auto;
        width: 100%;
      }

      /* ── Views ── */
      .view {
        display: none;

      .view.active {
        display: block;

      /* ── Cards / panels ── */

        background: var(--bg2);
        border: 1px solid var(--border);

        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--text2);
        margin-bottom: 8px;
      }
      .card-val {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text);
      }
      .card-sub {
        font-size: 0.75rem;
        color: var(--text2);
        margin-top: 2px;
      }

      /* ── Status badges ── */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 0.7rem;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 10px;
        white-space: nowrap;
      }
      .badge::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .badge-done {
        background: color-mix(in srgb, var(--done) 15%, transparent);
        color: var(--done);
      }
      .badge-done::before {
        background: var(--done);
      }
      .badge-in_progress {
        background: color-mix(in srgb, var(--in-progress) 15%, transparent);
        color: var(--in-progress);
      }
      .badge-in_progress::before {
        background: var(--in-progress);
      }
      .badge-review {
        background: color-mix(in srgb, var(--review) 15%, transparent);
        color: var(--review);
      }
      .badge-review::before {
        background: var(--review);
      }
      .badge-pr_open {
        background: color-mix(in srgb, var(--pr-open) 15%, transparent);
        color: var(--pr-open);
      }
      .badge-pr_open::before {
        background: var(--pr-open);
      }
      .badge-ready {
        background: color-mix(in srgb, var(--ready) 15%, transparent);
        color: var(--ready);
      }
      .badge-ready::before {
        background: var(--ready);
        border: 1px solid var(--ready);
        background: transparent;
      }
      .badge-planned {
        background: color-mix(in srgb, var(--planned) 20%, transparent);
        color: var(--planned);
      }
      .badge-planned::before {
        background: var(--planned);
      }
      .badge-blocked {
        background: color-mix(in srgb, var(--blocked) 15%, transparent);
        color: var(--blocked);
      }
      .badge-blocked::before {
        background: var(--blocked);
      }
      .badge-draft {
        background: color-mix(in srgb, var(--draft) 15%, transparent);
        color: var(--draft);
      }
      .badge-draft::before {
        display: none;

      /* ── Kanban ── */

      .kanban-card .kc-title {

      .kanban-card .kc-meta {

        color: var(--text3);
        margin-top: 4px;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        align-items: center;
      }
      .kanban-card .kc-flags {

      .kanban-empty {

      /* ── Tree ── */
      .tree-summary {

        margin-bottom: 8px;
      }
      .tree-summary-head .card-title {

      .tree-summary-val {

      .tree-summary-sub {

      .tree-root {

      .tree-node {
      }

      .tree-row:hover {

      }
      .tree-row.match {

      .tree-toggle {
        width: 16px;
        height: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text3);
        font-size: 0.7rem;
        flex-shrink: 0;
        transition: transform 0.15s;
      }
      .tree-toggle.open {
        transform: rotate(90deg);

      .tree-toggle-leaf {
        width: 16px;
        flex-shrink: 0;
      }
      .tree-num {
        font-size: 0.65rem;

      .tree-status {

      }
      .tree-progress {
        font-size: 0.65rem;
        color: var(--text3);
        white-space: nowrap;
      }
      .tree-children {
        margin-left: 16px;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .tree-children.hidden {
        display: none;
      }

      /* ── Milestones ── */
      .ms-grid {
        display: grid;

      }
      .ms-card {
        background: var(--bg2);
        border: 1px solid var(--border);

      .ms-actions {

        margin-top: 10px;

      .ms-filter-btn {

        border: 1px solid var(--border);

        color: var(--accent);

      }
      .ms-filter-btn:hover {

      /* ── Detail panel ── */

        background: rgba(0, 0, 0, 0.45);
        z-index: 200;
        display: none;
      }
      .detail-overlay.open {
        display: block;
      }
      .detail-panel {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(520px, 100vw);
        background: var(--bg2);
        border-left: 1px solid var(--border);
        z-index: 201;
        overflow-y: auto;
        padding: 20px;
        transform: translateX(100%);
        transition: transform 0.2s ease;

      .detail-panel.open {
        transform: translateX(0);

      }

        margin-bottom: 10px;
      }

      }

      }

        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text3);
        margin-bottom: 6px;
      }

      }

      }

      }

        flex-wrap: wrap;

      }
      .dep-chip {
        font-size: 0.7rem;
        font-family: var(--mono);
        background: var(--bg3);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 2px 7px;
        cursor: pointer;
        color: var(--accent);
      }
      .dep-chip:hover {
        border-color: var(--accent);
      }

      /* ── Filter select ── */
      select.filter-sel {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text2);
        padding: 5px 8px;
        font-size: 0.78rem;
        cursor: pointer;

      const { pano, derived, meta } = PANO_PAYLOAD;
      const P = derived;

      // ── Helpers ──────────────────────────────────────────────────────────────────
      function esc(s) {
        if (s == null) return "";
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function statusLabel(s) {
        const labels = {
          planned: "Planned", ready: "Ready", in_progress: "In Progress",
          review: "Review", pr_open: "PR Open", done: "Done"
        };
        return labels[s] || s || "—";
      }

      function statusColor(s) {
        const map = {
          planned: "var(--planned)", ready: "var(--ready)", in_progress: "var(--in-progress)",
          review: "var(--review)", pr_open: "var(--pr-open)", done: "var(--done)"
        };
        return map[s] || "var(--text3)";
      }

        return `<span class="badge ${esc(cls)}">${esc(text)}</span>`;
      }

      function statusBadge(s) {
        if (!s) return "";
        return badge(statusLabel(s), `badge-${s}`);
      }

      function progressBar(pct, done_class) {

      }

            if (n.children && n.children.length) walk(n.children);

        }
        walk(nodes);
        return out;
      }

      function isLeaf(n) {
        return !n.children || n.children.length === 0;

      function getMilestone(id) {
        return pano.milestones.find(m => m.id === id);

      // ── Tab navigation ────────────────────────────────────────────────────────────
      const tabBtns = document.querySelectorAll(".tab-btn");
      const views = document.querySelectorAll(".view");

      function switchView(viewId) {
        tabBtns.forEach(b => {
          const active = b.dataset.view === viewId;
          b.classList.toggle("active", active);
          b.setAttribute("aria-selected", active ? "true" : "false");
        });
        views.forEach(v => v.classList.toggle("active", v.id === "view-" + viewId));

        if (viewId === "kanban" && !kanbanBuilt) buildKanban();
        if (viewId === "milestones" && !msBuilt) buildMilestones();
      }

      tabBtns.forEach(btn => {
        btn.addEventListener("click", () => switchView(btn.dataset.view));
      });

            `${arch.version || ""}${arch.adrs ? " · " + arch.adrs + " ADRs" : ""}`;
        } else {
          document.getElementById("arch-row").remove();
        }

        // Phase cards
        const phaseCards = document.getElementById("phase-cards");
        const activeMsId = P.activeMilestoneId;
        const activeMs = pano.milestones.find(m => m.id === activeMsId);
        const prog = P.overallProgress;

        phaseCards.innerHTML = `
          <div class="card">
            <div class="card-title">Active Phase</div>

          </div>
          <div class="card">
            ${(() => {
              const tid = P.currentTaskId || P.nextReadyTaskId;

        const alerts = document.getElementById("overview-alerts");
        const items = [];

        if (P.nextReadyTaskId) {
          const t = getNode(P.nextReadyTaskId);
          items.push({ icon: "▶", label: "Next ready task", desc: `${t.code ? t.code + " — " : ""}${t.title}`, action: () => openDetail(P.nextReadyTaskId) });
        }
        if (P.currentTaskId) {
          const t = getNode(P.currentTaskId);
          items.push({ icon: "⚡", label: "Active work", desc: `${t.code ? t.code + " — " : ""}${t.title} [${statusLabel(t.status)}]`, action: () => openDetail(P.currentTaskId) });

        if (P.awaitingReviewCount > 0) {

        if (P.blockedCount > 0) {

        if (items.length === 0) {

        } else {

              <span class="alert-icon">${esc(item.icon)}</span>
              <div class="alert-body"><strong>${esc(item.label)}</strong><span>${esc(item.desc)}</span></div>
            </div>
          `).join("");
          alerts.querySelectorAll("[data-action]").forEach((el, i) => {

      // ── Tree view ─────────────────────────────────────────────────────────────────

        const counts = prog && Number.isFinite(prog.total) && Number.isFinite(prog.done)
          ? `<div class="tree-summary-sub">${esc(prog.done)} / ${esc(prog.total)} tasks completed</div>`
          : "";
        return `<div class="tree-summary-head">
            <span class="card-title">Overall Progress</span>
            <span class="tree-summary-val">${pct}%</span>
          </div>
          ${progressBar(pct, pct === 100 ? "progress-done" : "")}
          ${counts}`;
      }

      function buildTree() {
        treeBuilt = true;
        document.getElementById("tree-summary").innerHTML = treeProgressHtml(P.overallProgress);
        renderTree();

        document.getElementById("tree-expand-all").addEventListener("click", () => {
          getAllNodes(pano.nodes).forEach(n => { if (!isLeaf(n)) treeExpanded[n.id] = true; });

        document.getElementById("tree-collapse-all").addEventListener("click", () => {

      let treeSearchQuery = "";

      function treeMatchIds(nodes, query) {

          for (const n of list) {
            const text = ((n.title||"") + " " + (n.code||"") + " " + (n.id||"")).toLowerCase();
            if (text.includes(query)) {
              matched.add(n.id);
              for (const a of ancestors) matched.add(a);
            }
            if (n.children && n.children.length) walk(n.children, [...ancestors, n.id]);
          }

        walk(nodes, []);
        return matched;

        const root = document.getElementById("tree-root");

          const toggleEl = document.createElement("span");
          if (hasChildren) {
            toggleEl.className = "tree-toggle" + (isExpanded ? " open" : "");
            toggleEl.textContent = "▶";
            toggleEl.setAttribute("aria-hidden", "true");
          } else {
            toggleEl.className = "tree-toggle-leaf";
          }

          const numEl = document.createElement("span");
          numEl.className = "tree-num";
          numEl.textContent = visNum;

          const statusDot = document.createElement("span");
          statusDot.className = "tree-status";
          statusDot.style.background = n.status ? statusColor(n.status) : "var(--border)";
          statusDot.title = n.status ? statusLabel(n.status) : "No status";
          if (!isLeaf(n)) statusDot.style.opacity = "0.4";

          const titleEl = document.createElement("span");
          titleEl.className = "tree-title";
          titleEl.textContent = n.title || n.id;

          const chips = document.createElement("span");
          chips.className = "tree-chips";
          if (n.code) {
            const c = document.createElement("span");
            c.className = "badge";
            c.style.cssText = "font-size:.6rem;font-family:var(--mono);background:var(--accent-muted);color:var(--accent);";
            c.textContent = n.code;
            chips.appendChild(c);
          }
          if (n.draft) {
            const d = document.createElement("span");
            d.className = "badge badge-draft";
            d.textContent = "draft";
            chips.appendChild(d);
          }
          if (n.blocked) {
            const b = document.createElement("span");
            b.className = "badge badge-blocked";
            b.textContent = "blocked";
            chips.appendChild(b);
          }
          if (!hasChildren && n.status) {
            const s = document.createElement("span");
            s.className = `badge badge-${n.status}`;
            s.textContent = statusLabel(n.status);
            chips.appendChild(s);
          }

          if (hasChildren) {
            const prog = document.createElement("span");
            prog.className = "tree-progress";
            const msId = n.milestone;
            const pdata = msId ? P.milestoneProgress[msId] : null;
            if (pdata) prog.textContent = `${pdata.percentage}%`;
            chips.appendChild(prog);
          }

          row.appendChild(toggleEl);
          row.appendChild(numEl);
          row.appendChild(statusDot);
          row.appendChild(titleEl);
          row.appendChild(chips);

          row.addEventListener("click", (e) => {
            e.stopPropagation();
            if (hasChildren) {
              treeExpanded[n.id] = !isExpanded;
              renderTree();
            } else {
              openDetail(n.id);
            }
          });
          row.addEventListener("keydown", e => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              row.click();
            }
          });

          const nodeWrap = document.createElement("div");
          nodeWrap.className = "tree-node";
          nodeWrap.appendChild(row);

          if (hasChildren) {
            const childWrap = document.createElement("div");
            childWrap.className = "tree-children" + (isExpanded ? "" : " hidden");
            childWrap.appendChild(buildTreeNodes(n.children, depth+1, matchIds, visNum));
            nodeWrap.appendChild(childWrap);
          }

          frag.appendChild(nodeWrap);
        }
        return frag;
      }

      // ── Kanban ────────────────────────────────────────────────────────────────────
      let kanbanBuilt = false;

      function buildKanban() {
        kanbanBuilt = true;

        const filterPhase = document.getElementById("kanban-filter-phase");
        pano.milestones.forEach(ms => {
          const opt = document.createElement("option");
          opt.value = ms.id;
          opt.textContent = ms.code + " — " + ms.name;
          filterPhase.appendChild(opt);
        });

        filterPhase.addEventListener("change", renderKanban);
        document.getElementById("kanban-filter-draft").addEventListener("change", renderKanban);
        if (!getAllNodes(pano.nodes).some(n => n.draft)) {
          document.getElementById("kanban-draft-filter").hidden = true;
        }

        renderKanban();
      }

      function renderKanban() {
        const phaseFilter = document.getElementById("kanban-filter-phase").value;
        const draftFilter = document.getElementById("kanban-filter-draft").value;

        const allLeafs = getAllNodes(pano.nodes).filter(n => isLeaf(n) && n.type !== "group");
        const filtered = allLeafs.filter(n => {
          if (phaseFilter && n.milestone !== phaseFilter) return false;
          if (draftFilter === "no" && n.draft) return false;
          if (draftFilter === "yes" && !n.draft) return false;
          return true;
        });

        const cols = ["planned","ready","in_progress","review","pr_open","done"];
        const colLabels = {
          planned: "Planned", ready: "Ready", in_progress: "In Progress",
          review: "Review", pr_open: "PR Open", done: "Done"
        };

        const board = document.getElementById("kanban-board");
        board.innerHTML = cols.map(status => {
          const cards = filtered.filter(n => (n.status||"planned") === status);
          return `
            <div class="kanban-col">
              <div class="kanban-col-head">
                <span>${esc(colLabels[status])}</span>
                <span class="count">${cards.length}</span>
              </div>
              <div class="kanban-cards" data-status="${status}">
                ${cards.length === 0
                  ? `<div class="kanban-empty">Empty</div>`
                  : cards.map(n => buildKanbanCard(n)).join("")}
              </div>
            </div>
          `;
        }).join("");

        board.querySelectorAll(".kanban-card").forEach(card => {
          card.addEventListener("click", () => openDetail(card.dataset.id));
          card.addEventListener("keydown", e => { if (e.key==="Enter"||e.key===" ") openDetail(card.dataset.id); });
        });
      }

      function buildKanbanCard(n) {
        const ms = n.milestone ? getMilestone(n.milestone) : null;
        const fn = P.flatNodes[n.id];
        return `
          <div class="kanban-card" data-id="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(n.title)}">
            ${n.code ? `<div class="kc-code">${esc(n.code)}</div>` : ""}
            <div class="kc-title">${esc(n.title)}</div>
            <div class="kc-meta">
              ${ms ? `<span>${esc(ms.code)}</span>` : ""}
              ${n.branch ? `<span class="mono" style="font-size:.62rem;color:var(--text3);">${esc(n.branch)}</span>` : ""}
            </div>
            <div class="kc-flags">
              ${n.draft ? `<span class="badge badge-draft">draft</span>` : ""}
              ${n.blocked ? `<span class="badge badge-blocked">blocked</span>` : ""}
            </div>
          </div>
        `;
      }

      // ── Milestones ────────────────────────────────────────────────────────────────
      let msBuilt = false;

      function buildMilestones() {
        msBuilt = true;
        const grid = document.getElementById("ms-grid");
        grid.innerHTML = pano.milestones.map(ms => buildMsCard(ms)).join("");
        grid.querySelectorAll(".ms-filter-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            document.getElementById("kanban-filter-phase").value = btn.dataset.ms;
            switchView("kanban");
            if (!kanbanBuilt) buildKanban();
            else renderKanban();
          });
        });
      }

      function buildMsCard(ms) {
        const prog = P.milestoneProgress[ms.id] || { done: 0, total: 0, percentage: 0 };
        const all = getAllNodes(pano.nodes).filter(n => n.milestone === ms.id && isLeaf(n) && n.type !== "group");
        const blocked = all.filter(n => n.blocked).length;

        return `
          <div class="ms-card${ms.active ? " active-ms" : ""}">
            <div class="ms-head">
              <div>
                <div class="ms-code">${esc(ms.code)}</div>
                <div class="ms-name">${esc(ms.name)}</div>
              </div>
              <div style="display:flex;gap:6px;flex-wrap:wrap;">
                ${ms.active ? `<span class="badge badge-in_progress">Active</span>` : ""}
                ${ms.draft ? `<span class="badge badge-draft">Draft</span>` : ""}
                ${ms.status ? statusBadge(ms.status) : ""}
              </div>
            </div>
            ${ms.description ? `<p class="ms-desc">${esc(ms.description)}</p>` : ""}
            <div style="margin-bottom:8px;">${progressBar(prog.percentage, prog.percentage===100?"progress-done":"")}</div>
            <div class="ms-stats">
              <span><strong>${prog.percentage}%</strong> complete</span>
              ${prog.total !== undefined ? `<span><strong>${prog.done}</strong> / <strong>${prog.total}</strong> tasks done</span>` : ""}
              ${blocked > 0 ? `<span style="color:var(--blocked)"><strong>${blocked}</strong> blocked</span>` : ""}
            </div>
            <div class="ms-actions">
              <button class="ms-filter-btn" data-ms="${esc(ms.id)}">View in Kanban →</button>
            </div>
          </div>
        `;
      }

      // ── Detail panel ──────────────────────────────────────────────────────────────
      function openDetail(nodeId) {
        const n = getNode(nodeId);
        if (!n) return;
        const panel = document.getElementById("detail-panel");
        const overlay = document.getElementById("detail-overlay");
        const content = document.getElementById("detail-content");

        const fn = P.flatNodes[n.id];
        const ms = n.milestone ? getMilestone(n.milestone) : null;
        const deps = (n.depends_on || []).map(d => getNode(d)).filter(Boolean);
        const revDeps = (P.reverseDeps[n.id] || []).map(d => getNode(d)).filter(Boolean);

        let html = "";

        if (n.code) html += `<div class="detail-code">${esc(n.code)}</div>`;
        html += `<div class="detail-title">${esc(n.title)}</div>`;

        html += `<div class="detail-badges">`;
        if (n.status) html += statusBadge(n.status);
        if (n.type && n.type !== "group") html += badge(n.type, "badge-planned");
        if (n.draft) html += badge("draft", "badge-draft");
        if (n.blocked) html += badge("blocked", "badge-blocked");
        if (ms) html += badge(ms.code, "badge-planned");
        html += `</div>`;

        html += `<div class="detail-section"><div class="detail-kv">`;
        if (fn) html += `<div class="detail-kv-row"><span class="k">Position</span><span class="v">${esc(fn.visibleNumber)} (depth ${fn.depth})</span></div>`;
        if (n.branch) html += `<div class="detail-kv-row"><span class="k">Branch</span><span class="v">${esc(n.branch)}</span></div>`;
        if (n.pr) html += `<div class="detail-kv-row"><span class="k">PR</span><span class="v">${esc(n.pr.ref)}${n.pr.note ? " (" + esc(n.pr.note) + ")" : ""}</span></div>`;
        if (n.owner) html += `<div class="detail-kv-row"><span class="k">Owner</span><span class="v">${esc(n.owner)}</span></div>`;
        if (n.blocked) html += `<div class="detail-kv-row"><span class="k">Blocked</span><span class="v" style="color:var(--blocked)">${esc(n.blocked)}</span></div>`;
        html += `</div></div>`;

        if (n.description) {
          html += `<div class="detail-section"><h4>Description</h4><p>${esc(n.description)}</p></div>`;
        }

        if (n.acceptance_criteria && n.acceptance_criteria.length) {
          html += `<div class="detail-section"><h4>Acceptance criteria</h4><ul>`;
          n.acceptance_criteria.forEach(c => { html += `<li>${esc(c)}</li>`; });
          html += `</ul></div>`;
        }

        if (n.expected_output) {
          html += `<div class="detail-section"><h4>Expected output</h4><p>${esc(n.expected_output)}</p></div>`;
        }

        if (deps.length > 0) {
          html += `<div class="detail-section"><h4>Depends on</h4><div class="dep-list">`;
          deps.forEach(d => { html += `<span class="dep-chip" data-id="${esc(d.id)}">${esc(d.code || d.id)} — ${esc(d.title)}</span>`; });
          html += `</div></div>`;
        }

        if (revDeps.length > 0) {
          html += `<div class="detail-section"><h4>Required by</h4><div class="dep-list">`;
          revDeps.forEach(d => { html += `<span class="dep-chip" data-id="${esc(d.id)}">${esc(d.code || d.id)} — ${esc(d.title)}</span>`; });
          html += `</div></div>`;
        }

        if (n.evidence && n.evidence.length) {
          html += `<div class="detail-section"><h4>Evidence</h4><div class="detail-ev">`;
          n.evidence.forEach(ev => {
            html += `<div class="ev-item"><div class="ev-type">${esc(ev.type)}</div>`;
            if (ev.sha) html += `<div class="ev-desc mono">${esc(ev.sha)}</div>`;
            if (ev.ref) html += `<div class="ev-desc">${esc(ev.ref)}</div>`;
            if (ev.description) html += `<div class="ev-desc">${esc(ev.description)}</div>`;
            if (ev.note) html += `<div class="ev-note">${esc(ev.note)}</div>`;
            html += `</div>`;
          });
          html += `</div></div>`;
        }

        if (n.files && n.files.length) {
          html += `<div class="detail-section"><h4>Related files</h4><ul>`;
          n.files.forEach(f => { html += `<li class="mono" style="font-size:.72rem;">${esc(f)}</li>`; });
          html += `</ul></div>`;
        }

        content.innerHTML = html;

        // Wire dep-chip clicks
        content.querySelectorAll(".dep-chip").forEach(chip => {
          chip.addEventListener("click", () => openDetail(chip.dataset.id));
        });

        overlay.classList.add("open");
        panel.classList.add("open");
        panel.querySelector(".detail-close").focus();
      }

      function closeDetail() {
        document.getElementById("detail-overlay").classList.remove("open");
        document.getElementById("detail-panel").classList.remove("open");
      }

      document.getElementById("detail-close").addEventListener("click", closeDetail);
      document.getElementById("detail-overlay").addEventListener("click", (e) => {
        if (e.target === e.currentTarget) closeDetail();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeDetail();
      });

      // ── Init ──────────────────────────────────────────────────────────────────────
      buildOverview();
    </script>
  </body>
</html>
